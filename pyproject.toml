[project]
name = "potts-gpt"
version = "0.1.0"
description = "autoregressive transformer sampler for the 2D Potts model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["."]
